# voice-commander — drop this into ~/.config/hypr/ and `source` it from hyprland.conf:
#
#   source = ~/.config/hypr/voice-commander.conf

# A bare function key is the best push-to-talk binding there is. `bind` fires on press,
# `bindr` on release — and with no modifier involved, the release cannot be missed (see the
# note at the bottom).
bind  = , F7, exec, voice-commander start --profile dictate
bindr = , F7, exec, voice-commander stop  --profile dictate

# Hold Super+D to dictate instead, if you would rather keep the function keys free.
bind  = SUPER, D, exec, voice-commander start --profile dictate
bindr = SUPER, D, exec, voice-commander stop  --profile dictate

# Hold Super+A to talk to an agent.
bind  = SUPER, A, exec, voice-commander start --profile agent
bindr = SUPER, A, exec, voice-commander stop  --profile agent

# A toggle profile needs only one binding.
bind  = SUPER_SHIFT, J, exec, voice-commander toggle --profile journal

# Throw away whatever is in flight.
bind  = SUPER, Escape, exec, voice-commander cancel

# NOTE: with a modifier, if you let go of SUPER before the letter, Hyprland may never deliver
# the release and the recording would run on. The daemon's `max_recording_secs` watchdog stops
# it regardless — a recording exactly that long is the symptom, and `voice-commander stats`
# counts them for you.
#
# A bare key like F7 sidesteps this completely: there is no modifier to release early. If you
# do use a modifier, binding by keycode (`code:40` for `d`) also keeps the binding working
# when you switch keyboard layouts.
