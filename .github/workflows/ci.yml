name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # cpal links against ALSA, which is how it reaches PipeWire on a real desktop.
      # The runner has no sound server, but it still needs the headers to compile.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      # No test in this workspace may require a microphone or network access: capture is
      # tested against a fixture-replaying AudioSource and HTTP against a local mock server.
      # Tests needing real hardware are #[ignore]d and run by hand.
      - name: Tests
        run: cargo test --workspace --all-features

      - name: Release build
        run: cargo build --workspace --release
