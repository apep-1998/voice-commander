# The baseline every configuration is layered on top of.
#
# This file is compiled into the binary. It is the single source of truth for every default
# value in voice-commander, which is why the Rust structs carry so few `#[serde(default)]`
# attributes: the defaults live here, where they can be read.
#
# Do not edit this file to configure the tool. Put your settings in
# ~/.config/voice-commander/config.toml, which is merged on top of this one.

[daemon]
autostart = false
log_level = "info"

[audio]
# 16 kHz mono is what speech models are trained on. Higher rates cost size and buy nothing.
sample_rate = 16000
channels = 1
format = "wav"

[levels]
# Thresholds that turn a raw signal level into a warning a person can act on.
silence_dbfs = -55.0
too_quiet_dbfs = -40.0
speech_dbfs = -45.0
silence_warn_after_ms = 1000

[storage]
max_age_days = 0
max_total_bytes = 0
keep_audio_after_transcribe = true

[feedback]
enabled = true
listening = true
processing = true
processing_linger_ms = 1500
level_interval_ms = 50
presenters = ["socket"]

[presenters.socket]
type = "socket"

# Inherited by every profile. A profile states only what it does differently.
[defaults.capture]
mode = "preroll"
pre_roll_ms = 500
idle_release_secs = 300
device = "default"

[defaults.session]
cooldown_ms = 1500
max_recording_secs = 120
max_total_secs = 300

[defaults.continuation]
gap = "keep"
silence_ms = 300
max_segments = 5

# A profile that works with no API key and no external tools: it records, and the recording
# is archived. Everything else is opt-in.
[profiles.default]
trigger = "push_to_talk"
transcriber = false
sinks = []
